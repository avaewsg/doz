<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DozX | دوزایکس آنلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            background: #05050a;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(176, 0, 255, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 15px;
        }

        .card {
            background: rgba(13, 13, 25, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 30px;
            padding: 30px 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(0, 243, 255, 0.05);
            text-align: center;
            position: relative;
            animation: cardAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 40px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f3ff, #b000ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

        .login-box-glow {
            background: radial-gradient(circle, rgba(0,243,255,0.08) 0%, transparent 70%);
            border-radius: 20px;
            padding: 5px;
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            border: 2px solid rgba(0, 243, 255, 0.5);
            background: rgba(8, 8, 18, 0.9);
            color: #fff;
            font-size: 17px;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .neon-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f3ff, #7000ff);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 18px;
            font-family: 'Lalezar', cursive;
            letter-spacing: 1px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(112, 0, 255, 0.5);
            transition: all 0.25s ease;
            margin-top: 5px;
        }

        .neon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 243, 255, 0.7);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: none;
            margin-top: 10px;
        }

        .danger-btn {
            background: linear-gradient(135deg, #ff4757, #ff1e56);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
        }

        .admin-btn {
            background: linear-gradient(135deg, #ffa502, #ff7f50);
            box-shadow: 0 6px 20px rgba(255, 165, 2, 0.5);
            margin-bottom: 12px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-badge {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sticker-icon {
            width: 22px;
            height: 22px;
            vertical-align: middle;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.7));
        }

        /* تیک آبی رسمی تلگرامی */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: #229ed9;
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            margin-right: 4px;
            vertical-align: middle;
            box-shadow: 0 0 8px rgba(34, 158, 217, 0.8);
        }

        .leaderboard-container {
            background: rgba(8, 8, 16, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .leaderboard-title {
            font-family: 'Lalezar', cursive;
            font-size: 16px;
            color: #00f3ff;
            margin-bottom: 6px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .cell {
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 16px;
            height: 90px;
            font-size: 50px;
            font-family: 'Lalezar', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.08);
        }

        .cell.x { color: #00f3ff; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8); }
        .cell.o { color: #ff007f; text-shadow: 0 0 15px rgba(255, 0, 127, 0.8); }

        .chat-box {
            background: rgba(8, 8, 16, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 8px;
            margin-top: 10px;
            text-align: right;
        }

        .chat-messages {
            height: 80px;
            overflow-y: auto;
            font-size: 12px;
            margin-bottom: 6px;
            padding: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .chat-input-row {
            display: flex;
            gap: 6px;
        }

        .chat-input-row input {
            padding: 8px;
            font-size: 13px;
            margin: 0;
        }

        .chat-input-row button {
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
            margin: 0;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #111122;
            border: 2px solid #ffa502;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .user-row-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }

        .hidden { display: none !important; }

        .loader {
            width: 45px; height: 45px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- ۱. صفحه ورود و ثبت‌نام -->
    <div id="login-section" class="card">
        <h2>DozX</h2>
        <p>لطفاً وارد شوید یا ثبت‌نام کنید:</p>
        <div class="login-box-glow">
            <div class="input-box">
                <input type="text" id="username-input" placeholder="نام کاربری">
            </div>
            <div class="input-box">
                <input type="password" id="password-input" placeholder="رمز عبور">
            </div>
            <button class="neon-btn" onclick="registerUser()">ثبت‌نام حساب جدید 📝</button>
            <button class="neon-btn secondary-btn" onclick="loginUser()">ورود به حساب موجود ⚡</button>
        </div>
    </div>

    <!-- ۲. منوی اصلی -->
    <div id="menu-section" class="card hidden">
        <h3 id="welcome-user" style="font-size: 22px; font-family: 'Lalezar', cursive; color: #00f3ff; margin-bottom: 10px;">سلام</h3>
        
        <div class="stats-row">
            <div class="stat-badge">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd700'><circle cx='12' cy='12' r='9'/><path d='M12 6v12M15 9.5c0-.83-.67-1.5-1.5-1.5h-2c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h2c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-2c-.83 0-1.5-.67-1.5-1.5' fill='none' stroke='%23b8860b' stroke-width='1.5'/></svg>" class="sticker-icon" alt="Coin">
                سکه: <span id="coins-val">40</span>
            </div>
            <div class="stat-badge">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd700'><path d='M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.4 4.94C8.63 13.53 10.34 15 12 15s3.37-1.47 4.6-4.06C19.08 10.63 21 8.55 21 6V5c0-1.1-.9-2-2-2m-2 2v1.08C16.32 9.4 15.34 10 12 10s-4.32-.6-5-1.92V7h10M5 7h2v1.5c0 .34.05.67.14 1C6.26 9.3 5 8.24 5 7m14 0c0 1.24-1.26 2.3-2.14 2.5.09-.33.14-.66.14-1V7h2m-7 10c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z'/></svg>" class="sticker-icon" alt="Trophy">
                کاپ: <span id="trophies-val">0</span>
            </div>
        </div>

        <button id="admin-panel-btn" class="neon-btn admin-btn hidden" onclick="openAdminPanel()">👑 پنل مدیریت سکه‌ها</button>

        <div class="leaderboard-container">
            <div class="leaderboard-title">🏆 ۱۰ نفر برتر DozX</div>
            <div id="leaderboard-list"></div>
        </div>

        <p style="background: rgba(0,243,255,0.04); border: 1px dashed rgba(0,243,255,0.25); padding: 8px; border-radius: 10px; margin-bottom: 15px; color: #a5b4fc; font-size: 12px;">
            ورودی: ۱۰ سکه | جایزه برنده: ۸۰ سکه + ۴۰ کاپ
        </p>
        <button class="neon-btn" onclick="findGame()">شروع بازی آنلاین 🎮</button>
    </div>

    <!-- ۳. صفحه انتظار -->
    <div id="waiting-section" class="card hidden">
        <h2>در حال جستجوی حریف...</h2>
        <div class="loader"></div>
        <p>منتظر بمانید تا بازیکن دیگری به DozX ملحق شود</p>
        <button class="neon-btn danger-btn" onclick="cancelSearch()">لغو جستجو</button>
    </div>

    <!-- ۴. صفحه بازی و چت -->
    <div id="game-section" class="card hidden">
        <div class="stats-row" style="margin-bottom: 10px; font-size: 13px;">
            <div class="stat-badge" style="color: #00f3ff;" id="p1-name">شما</div>
            <div class="stat-badge" style="color: #ff007f;" id="p2-name">حریف</div>
        </div>
        
        <div class="board" id="game-board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div id="turn-indicator" style="font-family: 'Lalezar', cursive; font-size: 20px; color: #ffeb3b; margin-bottom: 10px;">نوبت شماست!</div>

        <div class="chat-box">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="پیام به حریف...">
                <button class="neon-btn" onclick="sendChat()">ارسال</button>
            </div>
        </div>
    </div>
</div>

<!-- پنل مدیریت ادمین -->
<div id="admin-modal" class="modal hidden">
    <div class="modal-content">
        <h3 style="font-family: 'Lalezar', cursive; color: #ffa502; margin-top: 0;">مدیریت کاربران و سکه‌ها</h3>
        <div id="admin-user-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
        <button class="neon-btn danger-btn" onclick="closeAdminPanel()">بستن پنل</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoomId = null;
    let myTurn = false;

    function registerUser() {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if (!username || !password) return alert('لطفاً نام کاربری و رمز عبور را وارد کنید');
        socket.emit('register', { username, password });
    }

    function loginUser() {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if (!username || !password) return alert('لطفاً نام کاربری و رمز عبور را وارد کنید');
        socket.emit('login', { username, password });
    }

    socket.on('init_data', (user, isOwner) => {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
        
        let nameHtml = `سلام، ${user.username}`;
        if (isOwner) {
            nameHtml += ` <span class="verified-badge">✓</span>`;
            document.getElementById('admin-panel-btn').classList.remove('hidden');
        }
        document.getElementById('welcome-user').innerHTML = nameHtml + ' 🔥';
        updateStatsUI(user);
    });

    function updateStatsUI(user) {
        document.getElementById('coins-val').innerText = user.coins;
        document.getElementById('trophies-val').innerText = user.trophies;
    }

    socket.on('update_stats', (user) => {
        updateStatsUI(user);
    });

    socket.on('update_leaderboard', (topPlayers) => {
        const lbList = document.getElementById('leaderboard-list');
        lbList.innerHTML = '';
        topPlayers.forEach((p, index) => {
            const item = document.createElement('div');
            item.className = 'lb-item';
            let rankEmoji = `#${index + 1}`;
            if (index === 0) rankEmoji = '🥇';
            else if (index === 1) rankEmoji = '🥈';
            else if (index === 2) rankEmoji = '🥉';

            let nameDisplay = p.username;
            if (p.isOwner) {
                nameDisplay += ` <span class="verified-badge">✓</span>`;
            }

            item.innerHTML = `<span>${rankEmoji} ${nameDisplay}</span> <span style="color: #ffd700;">🏆 ${p.trophies}</span>`;
            lbList.appendChild(item);
        });
    });

    let allUsersCache = [];
    socket.on('update_user_list', (users) => {
        allUsersCache = users;
    });

    function openAdminPanel() {
        document.getElementById('admin-modal').classList.remove('hidden');
        const listDiv = document.getElementById('admin-user-list');
        listDiv.innerHTML = '';
        allUsersCache.forEach(u => {
            const row = document.createElement('div');
            row.className = 'user-row-admin';
            row.innerHTML = `<span>${u.username} (سکه: ${u.isOwner ? 'بی‌نهایت' : u.coins})</span> <button class="neon-btn" style="width: auto; padding: 4px 10px; font-size: 13px;" onclick="changeUserCoins('${u.username}')">تغییر سکه</button>`;
            listDiv.appendChild(row);
        });
    }

    function closeAdminPanel() {
        document.getElementById('admin-modal').classList.add('hidden');
    }

    function changeUserCoins(targetUsername) {
        const newCoins = prompt(`مقدار سکه جدید برای ${targetUsername} را وارد کنید:`);
        if (newCoins !== null && !isNaN(newCoins)) {
            socket.emit('admin_set_coins', { targetUsername, newCoins: parseInt(newCoins) });
            setTimeout(openAdminPanel, 300);
        }
    }

    socket.on('error_msg', (msg) => {
        alert(msg);
    });

    function findGame() {
        document.getElementById('menu-section').classList.add('hidden');
        document.getElementById('waiting-section').classList.remove('hidden');
        socket.emit('find_game');
    }

    function cancelSearch() {
        socket.emit('cancel_search');
    }

    socket.on('search_cancelled', () => {
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
    });

    socket.on('game_start', (data) => {
        currentRoomId = data.roomId;
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('chat-messages').innerHTML = '';
        
        const playerIds = Object.keys(data.players);
        document.getElementById('p1-name').innerText = data.players[socket.id];
        const opponentId = playerIds.find(id => id !== socket.id);
        document.getElementById('p2-name').innerText = data.players[opponentId];
        
        const cells = document.getElementsByClassName('cell');
        for (let c of cells) {
            c.innerText = '';
            c.className = 'cell';
        }

        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    function makeMove(index) {
        if (!myTurn) return;
        socket.emit('make_move', { roomId: currentRoomId, index });
    }

    socket.on('update_board', (data) => {
        renderBoard(data.board);
        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    socket.on('game_over', (data) => {
        renderBoard(data.board);
        setTimeout(() => {
            if (data.isDraw) {
                alert('🤝 بازی مساوی شد! سکه‌های ورودی برگشت داده شد و کاپی تغییر نکرد.');
            } else {
                alert(`🏆 برنده: ${data.winnerName}`);
            }
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
        }, 400);
    });

    function sendChat() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        socket.emit('send_chat', { roomId: currentRoomId, message });
        input.value = '';
    }

    socket.on('receive_chat', ({ username, message }) => {
        const chatBox = document.getElementById('chat-messages');
        chatBox.innerHTML += `<div><b>${username}:</b> ${message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    function renderBoard(board) {
        const cells = document.getElementsByClassName('cell');
        for (let i = 0; i < 9; i++) {
            cells[i].innerText = board[i] || '';
            cells[i].className = 'cell';
            if (board[i] === 'X') cells[i].classList.add('x');
            if (board[i] === 'O') cells[i].classList.add('o');
        }
    }
</script>

</body>
</html>
