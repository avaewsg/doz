<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DozX | دوزایکس آنلاین</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            background: #05050a;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(176, 0, 255, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 15px;
        }

        /* کارت‌های شیشه‌ای خفن */
        .card {
            background: rgba(13, 13, 25, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 30px;
            padding: 35px 22px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(0, 243, 255, 0.05);
            text-align: center;
            position: relative;
            animation: cardAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 42px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f3ff, #b000ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
        }

        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }

        /* صفحه ورود خفن و نئونی */
        .login-box-glow {
            background: radial-gradient(circle, rgba(0,243,255,0.08) 0%, transparent 70%);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .input-box {
            position: relative;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 2px solid rgba(0, 243, 255, 0.5);
            background: rgba(8, 8, 18, 0.9);
            color: #fff;
            font-size: 19px;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.7), 0 0 15px rgba(0,243,255,0.1);
        }

        input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 3px 10px rgba(0,0,0,0.7);
        }

        /* دکمه‌های اکشن سایبرپانک */
        .neon-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f3ff, #7000ff);
            border: none;
            color: #fff;
            padding: 16px;
            font-size: 20px;
            font-family: 'Lalezar', cursive;
            letter-spacing: 1.5px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(112, 0, 255, 0.5);
            transition: all 0.25s ease;
        }

        .neon-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.7);
        }

        .neon-btn:active { transform: scale(0.97); }

        .danger-btn {
            background: linear-gradient(135deg, #ff4757, #ff1e56);
            box-shadow: 0 6px 25px rgba(255, 71, 87, 0.5);
        }
        .danger-btn:hover { box-shadow: 0 10px 30px rgba(255, 71, 87, 0.7); }

        /* پنل پروفایل و آمار */
        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-badge {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* استیکرهای سفارشی برداری (کاپ و سکه) */
        .sticker-icon {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7));
        }

        /* بخش لیدربرد (جدول رتبه‌بندی) */
        .leaderboard-container {
            background: rgba(8, 8, 16, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            max-height: 160px;
            overflow-y: auto;
        }

        .leaderboard-title {
            font-family: 'Lalezar', cursive;
            font-size: 18px;
            color: #00f3ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .lb-item:last-child { border-bottom: none; }

        /* تخته بازی DozX */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 25px 0;
        }

        .cell {
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 18px;
            height: 100px;
            font-size: 55px;
            font-family: 'Lalezar', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7);
        }

        .cell:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.08);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
        }

        .cell.x {
            color: #00f3ff;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.9);
            animation: popIn 0.3s ease;
        }

        .cell.o {
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.9);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden { display: none !important; }

        /* لودر انتظار */
        .loader {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 25px auto;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- ۱. صفحه ورود و ثبت نام فوق‌العاده خفن -->
    <div id="login-section" class="card">
        <h2>DozX</h2>
        <p>به نبرد آنلاین دوز خوش آمدید. نام خود را وارد کنید:</p>
        <div class="login-box-glow">
            <div class="input-box">
                <input type="text" id="username-input" placeholder="مثلا: کیا_گیمر">
            </div>
            <button class="neon-btn" onclick="login()">ورود به میدان مبارزه ⚡</button>
        </div>
    </div>

    <!-- ۲. منوی اصلی، پروفایل و لیدربرد -->
    <div id="menu-section" class="card hidden">
        <h3 id="welcome-user" style="font-size: 24px; font-family: 'Lalezar', cursive; color: #00f3ff; margin-bottom: 12px; letter-spacing: 1px;">سلام</h3>
        
        <div class="stats-row">
            <div class="stat-badge">
                <!-- استیکر سکه طلایی -->
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd700'><circle cx='12' cy='12' r='9'/><path d='M12 6v12M15 9.5c0-.83-.67-1.5-1.5-1.5h-2c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h2c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-2c-.83 0-1.5-.67-1.5-1.5' fill='none' stroke='%23b8860b' stroke-width='1.5'/></svg>" class="sticker-icon" alt="Coin">
                سکه: <span id="coins-val">40</span>
            </div>
            <div class="stat-badge">
                <!-- استیکر کاپ سفارشی -->
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffd700'><path d='M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.4 4.94C8.63 13.53 10.34 15 12 15s3.37-1.47 4.6-4.06C19.08 10.63 21 8.55 21 6V5c0-1.1-.9-2-2-2m-2 2v1.08C16.32 9.4 15.34 10 12 10s-4.32-.6-5-1.92V7h10M5 7h2v1.5c0 .34.05.67.14 1C6.26 9.3 5 8.24 5 7m14 0c0 1.24-1.26 2.3-2.14 2.5.09-.33.14-.66.14-1V7h2m-7 10c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z'/></svg>" class="sticker-icon" alt="Trophy">
                کاپ: <span id="trophies-val">0</span>
            </div>
        </div>

        <!-- جدول لیدربرد ۱۰ نفر برتر -->
        <div class="leaderboard-container">
            <div class="leaderboard-title">🏆 ۱۰ نفر برتر DozX</div>
            <div id="leaderboard-list">
                <div class="lb-item"><span>در حال بارگذاری...</span></div>
            </div>
        </div>

        <p style="background: rgba(0,243,255,0.04); border: 1px dashed rgba(0,243,255,0.25); padding: 10px; border-radius: 14px; margin-bottom: 20px; color: #a5b4fc; font-size: 13px;">
            ورودی: ۱۰ سکه | جایزه برنده: ۸۰ سکه + ۴۰ کاپ
        </p>
        <button class="neon-btn" onclick="findGame()">شروع بازی آنلاین 🎮</button>
    </div>

    <!-- ۳. صفحه انتظار برای حریف -->
    <div id="waiting-section" class="card hidden">
        <h2>در حال جستجوی حریف...</h2>
        <div class="loader"></div>
        <p>منتظر بمانید تا بازیکن دیگری به DozX ملحق شود</p>
        <button class="neon-btn danger-btn" onclick="cancelSearch()">لغو جستجو</button>
    </div>

    <!-- ۴. صفحه اصلی بازی DozX -->
    <div id="game-section" class="card hidden">
        <div class="stats-row" style="margin-bottom: 12px; font-size: 14px;">
            <div class="stat-badge" style="color: #00f3ff;" id="p1-name">شما</div>
            <div class="stat-badge" style="color: #ff007f;" id="p2-name">حریف</div>
        </div>
        
        <div class="board" id="game-board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div id="turn-indicator" style="font-family: 'Lalezar', cursive; font-size: 22px; color: #ffeb3b; letter-spacing: 1px;">نوبت شماست!</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoomId = null;
    let myTurn = false;

    window.onload = () => {
        const savedName = localStorage.getItem('dozx_username');
        if (savedName) {
            document.getElementById('username-input').value = savedName;
        }
    };

    function login() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return alert('لطفاً یک نام کاربری وارد کنید');
        localStorage.setItem('dozx_username', username);
        socket.emit('login', username);
    }

    socket.on('init_data', (user) => {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
        document.getElementById('welcome-user').innerText = `سلام، ${user.username} 🔥`;
        updateStatsUI(user);
    });

    function updateStatsUI(user) {
        document.getElementById('coins-val').innerText = user.coins;
        document.getElementById('trophies-val').innerText = user.trophies;
    }

    socket.on('update_stats', (user) => {
        updateStatsUI(user);
    });

    // دریافت و نمایش رتبه‌بندی لیدربرد
    socket.on('update_leaderboard', (topPlayers) => {
        const lbList = document.getElementById('leaderboard-list');
        lbList.innerHTML = '';
        if (topPlayers.length === 0) {
            lbList.innerHTML = '<div class="lb-item"><span>کابری ثبت نشده است</span></div>';
            return;
        }
        topPlayers.forEach((p, index) => {
            const item = document.createElement('div');
            item.className = 'lb-item';
            let rankEmoji = `#${index + 1}`;
            if (index === 0) rankEmoji = '🥇';
            else if (index === 1) rankEmoji = '🥈';
            else if (index === 2) rankEmoji = '🥉';

            item.innerHTML = `<span>${rankEmoji} ${p.username}</span> <span style="color: #ffd700;">🏆 ${p.trophies}</span>`;
            lbList.appendChild(item);
        });
    });

    socket.on('error_msg', (msg) => {
        alert(msg);
    });

    function findGame() {
        document.getElementById('menu-section').classList.add('hidden');
        document.getElementById('waiting-section').classList.remove('hidden');
        socket.emit('find_game');
    }

    function cancelSearch() {
        socket.emit('cancel_search');
    }

    socket.on('search_cancelled', () => {
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
    });

    socket.on('game_start', (data) => {
        currentRoomId = data.roomId;
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        
        const playerIds = Object.keys(data.players);
        document.getElementById('p1-name').innerText = data.players[socket.id];
        const opponentId = playerIds.find(id => id !== socket.id);
        document.getElementById('p2-name').innerText = data.players[opponentId];
        
        const cells = document.getElementsByClassName('cell');
        for (let c of cells) {
            c.innerText = '';
            c.className = 'cell';
        }

        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    function makeMove(index) {
        if (!myTurn) return;
        socket.emit('make_move', { roomId: currentRoomId, index });
    }

    socket.on('update_board', (data) => {
        renderBoard(data.board);
        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    socket.on('game_over', (data) => {
        renderBoard(data.board);
        setTimeout(() => {
            if (data.isDraw) {
                alert('🤝 بازی در DozX مساوی شد!');
            } else {
                alert(`🏆 برنده این دور: ${data.winnerName}`);
            }
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
        }, 300);
    });

    function renderBoard(board) {
        const cells = document.getElementsByClassName('cell');
        for (let i = 0; i < 9; i++) {
            cells[i].innerText = board[i] || '';
            cells[i].className = 'cell';
            if (board[i] === 'X') cells[i].classList.add('x');
            if (board[i] === 'O') cells[i].classList.add('o');
        }
    }
</script>

</body>
</html>
