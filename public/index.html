<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نئون دوز آنلاین | Cyber Tic-Tac-Toe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap');

        * { box-sizing: border-box; }

        body {
            background: #090a0f;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        /* کارت‌های شیشه‌ای و نئونی */
        .card {
            background: rgba(18, 18, 30, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
            text-align: center;
            position: relative;
            animation: fadeIn 0.4s ease-out;
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 32px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f3ff, #b000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p { color: #a5b4fc; font-size: 14px; margin-bottom: 20px; }

        /* استایل اینپوت خفن */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            border: 2px solid rgba(0, 243, 255, 0.3);
            background: rgba(10, 10, 20, 0.6);
            color: #fff;
            font-size: 18px;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* دکمه‌های نئونی جذاب */
        .neon-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f3ff, #7000ff);
            border: none;
            color: #fff;
            padding: 16px;
            font-size: 18px;
            font-family: 'Lalezar', cursive;
            letter-spacing: 1px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4);
            transition: all 0.2s ease;
        }

        .neon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 243, 255, 0.6);
        }

        .neon-btn:active { transform: scale(0.97); }

        .danger-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }
        .danger-btn:hover { box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6); }

        /* پنل پروفایل و آمار */
        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-badge {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* تخته بازی نئونی فوق‌العاده */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .cell {
            background: rgba(15, 15, 25, 0.8);
            border: 2px solid rgba(0, 243, 255, 0.25);
            border-radius: 16px;
            height: 95px;
            font-size: 50px;
            font-family: 'Lalezar', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .cell:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.07);
            transform: scale(1.04);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* رنگ‌بندی حرکت‌ها با انیمیشن ظهور */
        .cell.x {
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
            animation: popIn 0.3s ease;
        }

        .cell.o {
            color: #ff4757;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        /* لودر جستجوی حریف */
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- ۱. صفحه ثبت‌نام و ورود -->
    <div id="login-section" class="card">
        <h2>ورود به نئون دوز</h2>
        <p>نام کاربری خود را وارد کنید تا همیشه ذخیره بماند:</p>
        <div class="input-box">
            <input type="text" id="username-input" placeholder="مثلا: کیا_گیمر">
        </div>
        <button class="neon-btn" onclick="login()">ورود به میدان مبارزه ⚡</button>
    </div>

    <!-- ۲. منوی اصلی و پروفایل بازیکن -->
    <div id="menu-section" class="card hidden">
        <h3 id="welcome-user" style="font-size: 22px; color: #00f3ff; margin-bottom: 15px;">سلام، کاربر</h3>
        <div class="stats-row">
            <div class="stat-badge">🪙 <span id="coins-val">40</span></div>
            <div class="stat-badge">🏆 <span id="trophies-val">0</span></div>
        </div>
        <p style="background: rgba(0,243,255,0.05); border: 1px dashed rgba(0,243,255,0.2); padding: 10px; border-radius: 12px; margin-bottom: 20px;">
            ورودی: ۱۰ سکه | جایزه برنده: ۸۰ سکه + ۴۰ کاپ
        </p>
        <button class="neon-btn" onclick="findGame()">شروع بازی آنلاین 🎮</button>
    </div>

    <!-- ۳. صفحه انتظار برای حریف -->
    <div id="waiting-section" class="card hidden">
        <h2>در حال جستجوی حریف...</h2>
        <div class="loader"></div>
        <p>منتظر بمانید تا بازیکن دیگری وارد شود</p>
        <button class="neon-btn danger-btn" onclick="cancelSearch()">لغو جستجو</button>
    </div>

    <!-- ۴. صفحه اصلی بازی نئونی -->
    <div id="game-section" class="card hidden">
        <div class="stats-row" style="margin-bottom: 10px; font-size: 14px;">
            <div class="stat-badge" style="color: #00f3ff;" id="p1-name">شما</div>
            <div class="stat-badge" style="color: #ff4757;" id="p2-name">حریف</div>
        </div>
        
        <div class="board" id="game-board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div id="turn-indicator" style="font-family: 'Lalezar', cursive; font-size: 20px; color: #ffeb3b; letter-spacing: 0.5px;">نوبت شماست!</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoomId = null;
    let myTurn = false;

    // بارگذاری خودکار نام ذخیره شده
    window.onload = () => {
        const savedName = localStorage.getItem('neon_tictactoe_username');
        if (savedName) {
            document.getElementById('username-input').value = savedName;
        }
    };

    function login() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return alert('لطفاً یک نام کاربری وارد کنید');
        localStorage.setItem('neon_tictactoe_username', username);
        socket.emit('login', username);
    }

    socket.on('init_data', (user) => {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
        document.getElementById('welcome-user').innerText = `سلام، ${user.username} 🔥`;
        updateStatsUI(user);
    });

    function updateStatsUI(user) {
        document.getElementById('coins-val').innerText = user.coins;
        document.getElementById('trophies-val').innerText = user.trophies;
    }

    socket.on('update_stats', (user) => {
        updateStatsUI(user);
    });

    socket.on('error_msg', (msg) => {
        alert(msg);
    });

    function findGame() {
        document.getElementById('menu-section').classList.add('hidden');
        document.getElementById('waiting-section').classList.remove('hidden');
        socket.emit('find_game');
    }

    function cancelSearch() {
        socket.emit('cancel_search');
    }

    socket.on('search_cancelled', () => {
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('menu-section').classList.remove('hidden');
    });

    socket.on('game_start', (data) => {
        currentRoomId = data.roomId;
        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        
        const playerIds = Object.keys(data.players);
        document.getElementById('p1-name').innerText = data.players[socket.id];
        const opponentId = playerIds.find(id => id !== socket.id);
        document.getElementById('p2-name').innerText = data.players[opponentId];
        
        // ریست کردن تخته
        const cells = document.getElementsByClassName('cell');
        for (let c of cells) {
            c.innerText = '';
            c.className = 'cell';
        }

        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    function makeMove(index) {
        if (!myTurn) return;
        socket.emit('make_move', { roomId: currentRoomId, index });
    }

    socket.on('update_board', (data) => {
        renderBoard(data.board);
        myTurn = (data.turn === socket.id);
        document.getElementById('turn-indicator').innerText = myTurn ? '🟢 نوبت شماست!' : '⏳ نوبت حریف است...';
    });

    socket.on('game_over', (data) => {
        renderBoard(data.board);
        setTimeout(() => {
            if (data.isDraw) {
                alert('🤝 بازی مساوی شد!');
            } else {
                alert(`🏆 برنده این دور: ${data.winnerName}`);
            }
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
        }, 300);
    });

    function renderBoard(board) {
        const cells = document.getElementsByClassName('cell');
        for (let i = 0; i < 9; i++) {
            cells[i].innerText = board[i] || '';
            cells[i].className = 'cell';
            if (board[i] === 'X') cells[i].classList.add('x');
            if (board[i] === 'O') cells[i].classList.add('o');
        }
    }
</script>

</body>
</html>
